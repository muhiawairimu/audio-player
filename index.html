<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SoundWave | Audio Player & Podcast Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans flex flex-col">

  <!-- Header -->
  <header class="border-b border-slate-800 bg-slate-900/80 sticky top-0 z-40 backdrop-blur">
    <div class="max-w-5xl mx-auto px-4 py-4 flex justify-between items-center">
      <div class="flex items-center gap-3">
        <div class="p-2.5 bg-violet-600/20 text-violet-400 rounded-xl border border-violet-500/30">
          <i class="fa-solid fa-compact-disc text-2xl"></i>
        </div>
        <div>
          <h1 class="text-xl font-bold text-white tracking-wide">SoundWave</h1>
          <p class="text-xs text-slate-400">Custom Audio & Podcast Player</p>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Player Container -->
  <main class="max-w-5xl mx-auto px-4 py-8 flex-1 w-full flex flex-col lg:flex-row gap-8 items-start">

    <!-- Active Track Player -->
    <div class="w-full lg:w-1/2 bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl flex flex-col gap-6">
      
      <div class="flex flex-col items-center text-center gap-4">
        <div class="w-48 h-48 rounded-2xl bg-slate-800 border-2 border-slate-700/60 shadow-2xl overflow-hidden flex items-center justify-center">
          <i class="fa-solid fa-music text-5xl text-violet-400"></i>
        </div>
        <div>
          <h2 id="track-title" class="text-xl font-extrabold text-white">Loading Track...</h2>
          <p id="track-artist" class="text-sm font-medium text-violet-400 mt-1">SoundWave Studio</p>
        </div>
      </div>

      <!-- Scrubber -->
      <div class="flex flex-col gap-1.5">
        <div id="progress-container" class="w-full bg-slate-800 h-2 rounded-full cursor-pointer overflow-hidden relative">
          <div id="progress-bar" class="bg-violet-500 h-full w-0"></div>
        </div>
        <div class="flex justify-between text-xs text-slate-400 font-mono">
          <span id="current-time">0:00</span>
          <span id="duration-time">0:00</span>
        </div>
      </div>

      <!-- Controls -->
      <div class="flex items-center justify-center gap-6">
        <button id="btn-prev" class="text-slate-300 hover:text-white text-lg"><i class="fa-solid fa-backward-step"></i></button>
        <button id="btn-play" class="w-14 h-14 bg-violet-600 hover:bg-violet-500 text-white rounded-full shadow-lg flex items-center justify-center text-xl">
          <i class="fa-solid fa-play ml-0.5"></i>
        </button>
        <button id="btn-next" class="text-slate-300 hover:text-white text-lg"><i class="fa-solid fa-forward-step"></i></button>
      </div>

      <!-- Volume Slider -->
      <div class="flex items-center gap-3 bg-slate-950 p-3 rounded-xl border border-slate-800">
        <i class="fa-solid fa-volume-high text-xs text-slate-400"></i>
        <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="0.8" class="w-full accent-violet-500 h-1.5 bg-slate-800 rounded-lg">
      </div>

    </div>

    <!-- Playlist -->
    <div class="w-full lg:w-1/2 bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl flex flex-col gap-4">
      <h3 class="font-bold text-white text-sm uppercase tracking-wider border-b border-slate-800 pb-3 flex items-center gap-2">
        <i class="fa-solid fa-list text-violet-400"></i> Up Next
      </h3>
      <div id="playlist-container" class="flex flex-col gap-2"></div>
    </div>

  </main>

  <script>
    const playlist = [
      { title: "Ambient Chill Lo-Fi", artist: "SoundWave Lounge", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" },
      { title: "Tech & Coding Focus Podcast", artist: "Developer Weekly", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3" },
      { title: "Acoustic Sunset Grooves", artist: "Horizon Beats", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3" }
    ];

    let currentTrackIndex = 0;
    let isPlaying = false;
    const audio = new Audio();
    audio.volume = 0.8;

    const trackTitle = document.getElementById('track-title');
    const trackArtist = document.getElementById('track-artist');
    const btnPlay = document.getElementById('btn-play');
    const btnPrev = document.getElementById('btn-prev');
    const btnNext = document.getElementById('btn-next');
    const volumeSlider = document.getElementById('volume-slider');
    const progressBar = document.getElementById('progress-bar');
    const progressContainer = document.getElementById('progress-container');
    const currentTimeEl = document.getElementById('current-time');
    const durationTimeEl = document.getElementById('duration-time');
    const playlistContainer = document.getElementById('playlist-container');

    function formatTime(secs) {
      if (isNaN(secs)) return "0:00";
      const m = Math.floor(secs / 60);
      const s = Math.floor(secs % 60);
      return `${m}:${s < 10 ? '0' : ''}${s}`;
    }

    function loadTrack(index) {
      currentTrackIndex = index;
      const track = playlist[currentTrackIndex];
      trackTitle.textContent = track.title;
      trackArtist.textContent = track.artist;
      audio.src = track.src;
      renderPlaylist();
    }

    function togglePlay() {
      if (isPlaying) {
        audio.pause();
        isPlaying = false;
        btnPlay.innerHTML = '<i class="fa-solid fa-play ml-0.5"></i>';
      } else {
        audio.play();
        isPlaying = true;
        btnPlay.innerHTML = '<i class="fa-solid fa-pause"></i>';
      }
    }

    function renderPlaylist() {
      playlistContainer.innerHTML = '';
      playlist.forEach((track, idx) => {
        const item = document.createElement('div');
        const isActive = idx === currentTrackIndex;
        item.className = `p-3 rounded-xl border flex items-center justify-between cursor-pointer transition ${
          isActive ? 'bg-violet-600/20 border-violet-500/50 text-white' : 'bg-slate-950/60 border-slate-800 text-slate-300'
        }`;
        item.innerHTML = `<div><p class="text-xs font-bold">${track.title}</p><p class="text-[11px] text-slate-400">${track.artist}</p></div>`;
        item.addEventListener('click', () => {
          loadTrack(idx);
          togglePlay();
        });
        playlistContainer.appendChild(item);
      });
    }

    btnPlay.addEventListener('click', togglePlay);
    btnNext.addEventListener('click', () => { loadTrack((currentTrackIndex + 1) % playlist.length); togglePlay(); });
    btnPrev.addEventListener('click', () => { loadTrack((currentTrackIndex - 1 + playlist.length) % playlist.length); togglePlay(); });

    audio.addEventListener('timeupdate', () => {
      if (audio.duration) {
        progressBar.style.width = `${(audio.currentTime / audio.duration) * 100}%`;
        currentTimeEl.textContent = formatTime(audio.currentTime);
        durationTimeEl.textContent = formatTime(audio.duration);
      }
    });

    progressContainer.addEventListener('click', (e) => {
      const clickX = e.offsetX;
      if (audio.duration) audio.currentTime = (clickX / progressContainer.clientWidth) * audio.duration;
    });

    volumeSlider.addEventListener('input', (e) => audio.volume = e.target.value);

    loadTrack(0);
  </script>
</body>
</html>
